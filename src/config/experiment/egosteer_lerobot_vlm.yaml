# @package _global_
defaults:
  - egosteer_lerobot
  - /dataset_paths/vlm_lerobot
  - _self_

name: egosteer_lerobot_vlm
exp_name: egosteer_lerobot_vlm

dataset:
  vlm_dataset:
    _target_: src.dataset.lerobot.vlm_dataset.VLMLeRobotDataset
    root: ${vlm_lerobot_root}
    split: ${vlm_lerobot_train_split}
    val_split: ${vlm_lerobot_val_split}
    weights: [0.5, 0.5, 0.5]
    seed: ${training.seed}
    target_image_size: ${data.target_image_size}
    shuffle_buffer: 16384
    shuffle_initial: 4096
    drop_ratio: 0.0
    sanity_checks: ${data.sanity_checks}
  # batch_size=8 -> 6 VLA and 2 VLM samples, in this order.
  vla_ratio: 0.75
